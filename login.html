<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h1>Login To Your Page</h1>
    <form action="api/vi/journals" method="get">
        <label for="name">First Name</label>
        <input id="name" type="text" name="firstName" placeholder="First Name">

        <br>

        <label for="lname">Last Name</label>
        <input id="lname" type="text" name="lastName" placeholder="Last Name" required>

        <br>
        <label for="pwd">Password</label>
        <input id="pwd" type="password" name="password" placeholder="Password" required>
        <br>

        <button type="submit">Submit</button>

    </form>


</body>
</html>
